{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock title %}

{% block canonical_url %}
<link href="{{ SITEURL }}/{{ page.url }}" rel="canonical" />
{% endblock canonical_url %}

{% block content %}
<article class="post" data-pagefind-body>
  <p class="post-crumb"><a href="{{ SITEURL }}/">{{ UI_STRINGS.breadcrumb_home[DEFAULT_LANG] }}</a> / {{ page.title }}</p>
  <h2 class="post-title" data-pagefind-meta="title">{{ page.title }}</h2>
  <div class="post-content">
    {{ page.content }}
  </div>
</article>
{% endblock content %}
