name: Build preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      - run: python -m pelican content -s publishconf.py -o output

      - uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: output
          retention-days: 7
